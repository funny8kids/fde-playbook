<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">四周备考计划：从扫盲到冲刺</text>

  <!-- timeline arrow -->
  <rect x="20" y="44" width="720" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="20" y="44" width="180" height="8" rx="4" fill="#2563eb"/>
  <rect x="200" y="44" width="180" height="8" rx="4" fill="#0d9488"/>
  <rect x="380" y="44" width="180" height="8" rx="4" fill="#ea580c"/>
  <rect x="560" y="44" width="180" height="8" rx="4" fill="#dc2626"/>

  <!-- Week 1 -->
  <rect x="20" y="66" width="172" height="240" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="20" y="66" width="172" height="36" rx="10" fill="#2563eb"/>
  <text x="106" y="90" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">第 1 周 · 基础扫盲</text>
  <text x="36" y="124" font-size="11" fill="#1e40af">· 通读讲义，搭建知识框架</text>
  <text x="36" y="146" font-size="11" fill="#1e40af">· 吃透大模型、Embedding、</text>
  <text x="46" y="164" font-size="11" fill="#1e40af">提示词基础概念</text>
  <text x="36" y="186" font-size="11" fill="#1e40af">· 动手体验 CoT、Few-shot</text>
  <text x="36" y="208" font-size="11" fill="#1e40af">· 整理易混概念对比表</text>
  <rect x="36" y="226" width="140" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="106" y="250" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">目标：搞定选择题</text>
  <text x="106" y="270" font-size="11" fill="#1e40af" text-anchor="middle">基础考点</text>

  <!-- Week 2 -->
  <rect x="200" y="66" width="172" height="240" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <rect x="200" y="66" width="172" height="36" rx="10" fill="#0d9488"/>
  <text x="286" y="90" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">第 2 周 · 主攻 RAG</text>
  <text x="216" y="124" font-size="11" fill="#0f766e">· 梳理 RAG 全链路</text>
  <text x="216" y="146" font-size="11" fill="#0f766e">· 重点理解分块策略、</text>
  <text x="226" y="164" font-size="11" fill="#0f766e">混合检索、评估指标</text>
  <text x="216" y="186" font-size="11" fill="#0f766e">· 手写“企业知识库</text>
  <text x="226" y="204" font-size="11" fill="#0f766e">实施方案”练逻辑</text>
  <rect x="216" y="226" width="140" height="60" rx="8" fill="#ffffff" stroke="#99f6e4"/>
  <text x="286" y="250" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">分值最高模块</text>
  <text x="286" y="270" font-size="11" fill="#0f766e" text-anchor="middle">提分关键</text>

  <!-- Week 3 -->
  <rect x="380" y="66" width="172" height="240" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="380" y="66" width="172" height="36" rx="10" fill="#ea580c"/>
  <text x="466" y="90" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">第 3 周 · Agent+方案</text>
  <text x="396" y="124" font-size="11" fill="#9a3412">· 掌握 Function Calling、</text>
  <text x="406" y="142" font-size="11" fill="#9a3412">ReAct 原理</text>
  <text x="396" y="164" font-size="11" fill="#9a3412">· 训练方案思维：需求→</text>
  <text x="406" y="182" font-size="11" fill="#9a3412">选型→部署→风险</text>
  <text x="396" y="204" font-size="11" fill="#9a3412">· 刷模拟题，简答题</text>
  <text x="406" y="222" font-size="11" fill="#9a3412">分点结构化作答</text>
  <rect x="396" y="238" width="140" height="48" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="466" y="266" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">会“答场景”</text>

  <!-- Week 4 -->
  <rect x="560" y="66" width="180" height="240" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="560" y="66" width="180" height="36" rx="10" fill="#dc2626"/>
  <text x="650" y="90" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">第 4 周 · 模拟冲刺</text>
  <text x="576" y="124" font-size="11" fill="#b91c1c">· 整套模拟机考，</text>
  <text x="586" y="142" font-size="11" fill="#b91c1c">控制答题时间</text>
  <text x="576" y="164" font-size="11" fill="#b91c1c">· 复盘错题，抓概念细节</text>
  <text x="576" y="186" font-size="11" fill="#b91c1c">· 简答题固定模板：</text>
  <text x="586" y="204" font-size="11" fill="#b91c1c">背景-方案-步骤-风险</text>
  <text x="576" y="226" font-size="11" fill="#b91c1c">· 回顾工程落地与合规</text>
  <rect x="576" y="240" width="148" height="46" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="650" y="268" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">查漏补缺，稳住心态</text>

  <text x="380" y="336" font-size="12" fill="#64748b" text-anchor="middle">提示：RAG 与简答题是得分重心，时间分配要向第 2、3 周倾斜</text>
</svg>
