<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">工具契约：Agent 可靠性的真正来源</text>

  <!-- contract card -->
  <rect x="20" y="46" width="360" height="256" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="70" font-size="12" font-weight="bold" fill="#334155">一份合格的工具定义</text>

  <rect x="40" y="82" width="320" height="206" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="54" y="104" font-size="10" fill="#1e40af">name: refund_order</text>
  <text x="54" y="126" font-size="10" fill="#334155">description: 对已支付订单发起退款。</text>
  <text x="54" y="142" font-size="10" fill="#334155">  仅在用户明确要求退款、且订单状态为</text>
  <text x="54" y="158" font-size="10" fill="#334155">  已支付/已发货时使用。金额 &gt; 200 元</text>
  <text x="54" y="174" font-size="10" fill="#334155">  需人工确认。</text>
  <text x="54" y="196" font-size="10" fill="#0d9488">parameters:</text>
  <text x="54" y="212" font-size="10" fill="#334155">  order_id: string (required, 形如 A123)</text>
  <text x="54" y="228" font-size="10" fill="#334155">  amount: number (≤ 订单实付)</text>
  <text x="54" y="244" font-size="10" fill="#334155">  reason: enum[质量/物流/无理由/其他]</text>
  <text x="54" y="266" font-size="10" fill="#dc2626">returns: {ok, refund_id, eta} | {error_code}</text>

  <!-- principles -->
  <rect x="396" y="46" width="344" height="256" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="416" y="70" font-size="12" font-weight="bold" fill="#1e40af">七条设计原则</text>
  <text x="416" y="96" font-size="11" fill="#334155">① 单一职责：一个工具一件事</text>
  <text x="416" y="120" font-size="11" fill="#334155">② 描述写「何时用 / 何时不用」</text>
  <text x="416" y="144" font-size="11" fill="#334155">③ 参数受控：枚举优于自由文本</text>
  <text x="416" y="168" font-size="11" fill="#334155">④ 写操作必须幂等（幂等键）</text>
  <text x="416" y="192" font-size="11" fill="#334155">⑤ 错误结构化：错误码 + 可执行提示</text>
  <text x="416" y="216" font-size="11" fill="#334155">⑥ 返回精简：只给模型需要的字段</text>
  <text x="416" y="240" font-size="11" fill="#334155">⑦ 权限最小化：按角色授权工具</text>
  <text x="416" y="272" font-size="10" fill="#64748b">反例：do_everything(action, params)</text>
  <text x="416" y="290" font-size="10" fill="#64748b">——模型永远选不对，也无法审计。</text>

  <!-- error handling -->
  <rect x="20" y="318" width="720" height="132" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="36" y="342" font-size="12" font-weight="bold" fill="#9a3412">错误返回的正确写法：让模型能自我修正</text>
  <rect x="40" y="352" width="330" height="42" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="54" y="378" font-size="10" fill="#b91c1c">✗ {"error": "Traceback ... NullPointerException"}</text>
  <rect x="390" y="352" width="330" height="42" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="404" y="378" font-size="10" fill="#15803d">✓ {"error_code":"ORDER_NOT_FOUND",</text>
  <text x="404" y="392" font-size="10" fill="#15803d">   "hint":"请确认订单号后重试"}</text>
  <text x="40" y="418" font-size="11" fill="#7c2d12">原因：堆栈对模型毫无意义，会诱发幻觉；结构化错误码 + 提示，模型才知道下一步该做什么。</text>
  <text x="40" y="438" font-size="11" fill="#7c2d12">同一原则适用于：超时、限流、权限不足、参数非法——每类都给固定错误码。</text>
</svg>
