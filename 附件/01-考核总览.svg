<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="486" fill="#ffffff"/>
  <rect x="20" y="20" width="720" height="54" rx="10" fill="#1d4ed8"/>
  <text x="40" y="54" font-size="22" font-weight="bold" fill="#ffffff">FDE 解决方案工程师（高级）· 考核总览</text>

  <!-- Card 1 -->
  <rect x="20" y="94" width="228" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="120" font-size="13" font-weight="bold" fill="#2563eb">发证单位</text>
  <text x="36" y="148" font-size="18" font-weight="bold" fill="#1e293b">工业和信息化部</text>
  <text x="36" y="172" font-size="18" font-weight="bold" fill="#1e293b">教育与考试中心</text>
  <text x="36" y="198" font-size="12" fill="#64748b">权威机构颁发的职业能力认证</text>

  <!-- Card 2 -->
  <rect x="260" y="94" width="228" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="276" y="120" font-size="13" font-weight="bold" fill="#0d9488">证书性质</text>
  <text x="276" y="150" font-size="18" font-weight="bold" fill="#1e293b">职业能力培训证书</text>
  <text x="276" y="176" font-size="14" fill="#334155">长期有效 · 无需年审</text>
  <text x="276" y="198" font-size="12" fill="#64748b">用于简历加分 / 项目投标 / 人才认定</text>

  <!-- Card 3 -->
  <rect x="500" y="94" width="228" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="516" y="120" font-size="13" font-weight="bold" fill="#ea580c">考试形式</text>
  <text x="516" y="150" font-size="18" font-weight="bold" fill="#1e293b">线上机考</text>
  <text x="516" y="176" font-size="14" fill="#334155">在家 / 办公室即可参加</text>
  <text x="516" y="198" font-size="12" fill="#64748b">提前调试摄像头与网络</text>

  <!-- Card 4 -->
  <rect x="20" y="224" width="228" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="250" font-size="13" font-weight="bold" fill="#7c3aed">考试时长</text>
  <text x="36" y="280" font-size="18" font-weight="bold" fill="#1e293b">约 90–100 分钟</text>
  <text x="36" y="306" font-size="14" fill="#334155">满分 100 分</text>
  <text x="36" y="328" font-size="12" fill="#64748b">简答题需预留构思时间</text>

  <!-- Card 5 -->
  <rect x="260" y="224" width="228" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="276" y="250" font-size="13" font-weight="bold" fill="#16a34a">题型构成</text>
  <text x="276" y="280" font-size="18" font-weight="bold" fill="#1e293b">单选题 + 简答题</text>
  <text x="276" y="306" font-size="14" fill="#334155">单选考概念细节</text>
  <text x="276" y="328" font-size="12" fill="#64748b">简答是拿分核心</text>

  <!-- Card 6 -->
  <rect x="500" y="224" width="228" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="516" y="250" font-size="13" font-weight="bold" fill="#dc2626">合格标准</text>
  <text x="516" y="280" font-size="18" font-weight="bold" fill="#1e293b">60 分及格</text>
  <text x="516" y="306" font-size="14" fill="#334155">重理解与应用</text>
  <text x="516" y="328" font-size="12" fill="#64748b">理解场景比背诵定义更易通过</text>

  <!-- Bottom band -->
  <rect x="20" y="364" width="720" height="102" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="40" y="392" font-size="15" font-weight="bold" fill="#1e40af">考核核心能力（不是死记硬背，而是落地实战）</text>
  <rect x="40" y="406" width="212" height="40" rx="20" fill="#2563eb"/>
  <text x="146" y="432" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">大模型企业落地</text>
  <rect x="264" y="406" width="212" height="40" rx="20" fill="#0d9488"/>
  <text x="370" y="432" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">解决方案设计</text>
  <rect x="488" y="406" width="212" height="40" rx="20" fill="#ea580c"/>
  <text x="594" y="432" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">工程部署实践</text>
</svg>
