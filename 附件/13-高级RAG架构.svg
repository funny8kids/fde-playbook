<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Advanced RAG 参考架构（可直接用于方案文档）</text>

  <!-- layer 1 data -->
  <rect x="20" y="44" width="720" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="66" font-size="12" font-weight="bold" fill="#475569">数据源层</text>
  <rect x="130" y="54" width="110" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="185" y="76" font-size="11" fill="#334155" text-anchor="middle">制度 / 手册</text>
  <text x="185" y="94" font-size="10" fill="#64748b" text-anchor="middle">PDF / Word</text>
  <rect x="250" y="54" width="110" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="305" y="76" font-size="11" fill="#334155" text-anchor="middle">工单 / 问答</text>
  <text x="305" y="94" font-size="10" fill="#64748b" text-anchor="middle">CRM / 表格</text>
  <rect x="370" y="54" width="110" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="425" y="76" font-size="11" fill="#334155" text-anchor="middle">业务数据库</text>
  <text x="425" y="94" font-size="10" fill="#64748b" text-anchor="middle">MySQL / 数仓</text>
  <rect x="490" y="54" width="110" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="545" y="76" font-size="11" fill="#334155" text-anchor="middle">网页 / 文件</text>
  <text x="545" y="94" font-size="10" fill="#64748b" text-anchor="middle">爬取 / 网盘</text>
  <rect x="610" y="54" width="110" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="665" y="76" font-size="11" fill="#334155" text-anchor="middle">API 实时数据</text>
  <text x="665" y="94" font-size="10" fill="#64748b" text-anchor="middle">库存 / 价格</text>

  <!-- layer 2 indexing -->
  <rect x="20" y="132" width="720" height="86" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="36" y="154" font-size="12" font-weight="bold" fill="#1e40af">索引流水线（离线 / 增量）</text>
  <rect x="130" y="142" width="118" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="189" y="166" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">解析清洗</text>
  <text x="189" y="184" font-size="10" fill="#64748b" text-anchor="middle">OCR / 去噪 / 表格</text>
  <rect x="258" y="142" width="118" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="317" y="166" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">分块 + 元数据</text>
  <text x="317" y="184" font-size="10" fill="#64748b" text-anchor="middle">父子块 / 部门 / 版本</text>
  <rect x="386" y="142" width="118" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="445" y="166" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">Embedding</text>
  <text x="445" y="184" font-size="10" fill="#64748b" text-anchor="middle">批量 / 增量更新</text>
  <rect x="514" y="142" width="118" height="60" rx="8" fill="#1d4ed8"/>
  <text x="573" y="166" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">向量库 + 索引</text>
  <text x="573" y="184" font-size="10" fill="#dbeafe" text-anchor="middle">HNSW / 倒排索引</text>
  <rect x="642" y="142" width="86" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="685" y="166" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">元数据库</text>
  <text x="685" y="184" font-size="10" fill="#64748b" text-anchor="middle">PG / ES</text>

  <!-- layer 3 retrieval -->
  <rect x="20" y="228" width="720" height="96" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="36" y="250" font-size="12" font-weight="bold" fill="#0f766e">检索层（在线，延迟 100–300ms）</text>
  <rect x="130" y="238" width="104" height="68" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="182" y="262" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">Query 改写</text>
  <text x="182" y="280" font-size="10" fill="#64748b" text-anchor="middle">扩写 / HyDE</text>
  <text x="182" y="296" font-size="10" fill="#64748b" text-anchor="middle">多查询</text>
  <rect x="244" y="238" width="104" height="68" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="296" y="262" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">权限过滤</text>
  <text x="296" y="280" font-size="10" fill="#64748b" text-anchor="middle">ACL / 租户</text>
  <text x="296" y="296" font-size="10" fill="#64748b" text-anchor="middle">元数据 filter</text>
  <rect x="358" y="238" width="104" height="68" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="410" y="262" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">混合召回</text>
  <text x="410" y="280" font-size="10" fill="#64748b" text-anchor="middle">向量 Top50</text>
  <text x="410" y="296" font-size="10" fill="#64748b" text-anchor="middle">+ BM25 Top50</text>
  <rect x="472" y="238" width="104" height="68" rx="8" fill="#7c3aed"/>
  <text x="524" y="262" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RRF 融合</text>
  <text x="524" y="280" font-size="10" fill="#ede9fe" text-anchor="middle">k=60</text>
  <text x="524" y="296" font-size="10" fill="#ede9fe" text-anchor="middle">去重取 Top20</text>
  <rect x="586" y="238" width="142" height="68" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="657" y="262" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">Re-rank 精排 → Top5</text>
  <text x="657" y="280" font-size="10" fill="#64748b" text-anchor="middle">交叉编码器</text>
  <text x="657" y="296" font-size="10" fill="#64748b" text-anchor="middle">父子块回填上下文</text>

  <!-- layer 4 generation -->
  <rect x="20" y="334" width="720" height="86" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="36" y="356" font-size="12" font-weight="bold" fill="#9a3412">生成层</text>
  <rect x="130" y="344" width="150" height="60" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="205" y="368" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">提示词模板</text>
  <text x="205" y="386" font-size="10" fill="#64748b" text-anchor="middle">角色 / 约束 / 引用编号</text>
  <rect x="290" y="344" width="150" height="60" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="365" y="368" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">上下文压缩</text>
  <text x="365" y="386" font-size="10" fill="#64748b" text-anchor="middle">去冗余 / 控 Token</text>
  <rect x="450" y="344" width="150" height="60" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="525" y="368" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">LLM 生成</text>
  <text x="525" y="386" font-size="10" fill="#64748b" text-anchor="middle">流式输出 / 拒答策略</text>
  <rect x="610" y="344" width="118" height="60" rx="8" fill="#ea580c"/>
  <text x="669" y="368" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">答案 + 引用</text>
  <text x="669" y="386" font-size="10" fill="#ffedd5" text-anchor="middle">可溯源</text>

  <!-- layer 5 eval -->
  <rect x="20" y="430" width="720" height="70" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="36" y="452" font-size="12" font-weight="bold" fill="#5b21b6">贯穿全程：评测与运营</text>
  <rect x="200" y="440" width="150" height="48" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="275" y="462" font-size="11" fill="#5b21b6" text-anchor="middle">黄金评测集</text>
  <text x="275" y="478" font-size="10" fill="#64748b" text-anchor="middle">100–300 条带答案</text>
  <rect x="362" y="440" width="150" height="48" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="437" y="462" font-size="11" fill="#5b21b6" text-anchor="middle">指标看板</text>
  <text x="437" y="478" font-size="10" fill="#64748b" text-anchor="middle">召回 / 忠实度 / 时延</text>
  <rect x="524" y="440" width="150" height="48" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="599" y="462" font-size="11" fill="#5b21b6" text-anchor="middle">Bad Case 闭环</text>
  <text x="599" y="478" font-size="10" fill="#64748b" text-anchor="middle">收集 → 归因 → 调参</text>
</svg>
