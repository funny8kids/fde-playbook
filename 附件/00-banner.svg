<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- 装饰网格 -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 60 H1280 M0 120 H1280 M0 180 H1280 M0 240 H1280 M0 300 H1280"/>
    <path d="M120 0 V340 M240 0 V340 M360 0 V340 M480 0 V340 M600 0 V340 M720 0 V340 M840 0 V340 M960 0 V340 M1080 0 V340 M1200 0 V340"/>
  </g>

  <!-- 左上光斑 -->
  <circle cx="1180" cy="30" r="220" fill="url(#glow)"/>
  <circle cx="80" cy="330" r="160" fill="#22d3ee" fill-opacity="0.06"/>

  <!-- 顶部细线 -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- 左侧文字 -->
  <text x="80" y="96" font-size="14" letter-spacing="3.2" fill="#818cf8" font-weight="600">FORWARD DEPLOYED ENGINEER · HANDBOOK</text>
  <text x="80" y="178" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-1">FDE Playbook</text>
  <rect x="80" y="200" width="300" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="80" y="244" font-size="25" fill="#cbd5e1">把客户的约束，翻译成能验收的方案</text>
  <text x="80" y="282" font-size="15" fill="#7c8aa0">RAG · Agent · 方案与商务 · 工程合规 · 行业案例</text>

  <!-- 分隔线 -->
  <line x1="880" y1="86" x2="880" y2="266" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 右侧数据 -->
  <g>
    <rect x="920" y="92" width="3" height="46" rx="1.5" fill="#6366f1"/>
    <text x="940" y="130" font-size="42" font-weight="700" fill="#f8fafc">44</text>
    <text x="1000" y="130" font-size="17" fill="#94a3b8">章 · 九篇 + 附录</text>

    <rect x="920" y="162" width="3" height="46" rx="1.5" fill="#22d3ee"/>
    <text x="940" y="200" font-size="42" font-weight="700" fill="#f8fafc">14.3</text>
    <text x="1030" y="200" font-size="17" fill="#94a3b8">万中文字</text>

    <rect x="920" y="232" width="3" height="46" rx="1.5" fill="#a78bfa"/>
    <text x="940" y="270" font-size="42" font-weight="700" fill="#f8fafc">38</text>
    <text x="1000" y="270" font-size="17" fill="#94a3b8">张自绘图 · 120 项清单</text>
  </g>

  <!-- 右下角签名线 -->
  <text x="1200" y="312" font-size="13" fill="#475569" text-anchor="end">Obsidian-ready · Markdown</text>
</svg>
