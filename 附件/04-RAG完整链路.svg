<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">RAG 完整工作链路：先“建档”，再“开卷答题”</text>

  <!-- Stage 1: indexing -->
  <rect x="20" y="44" width="720" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="20" y="44" width="150" height="30" rx="10" fill="#2563eb"/>
  <text x="95" y="65" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">① 索引阶段（离线）</text>

  <rect x="40" y="88" width="118" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="99" y="112" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">企业文档</text>
  <text x="99" y="132" font-size="11" fill="#64748b" text-anchor="middle">PDF/Word/网页</text>
  <path d="M158 116 L 178 116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="178" y="88" width="118" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="237" y="112" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">清洗与拆分</text>
  <text x="237" y="132" font-size="11" fill="#64748b" text-anchor="middle">去噪 / 去格式</text>
  <path d="M296 116 L 316 116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="316" y="88" width="118" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="375" y="112" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">文档分块</text>
  <text x="375" y="132" font-size="11" fill="#64748b" text-anchor="middle">Chunking 切片</text>
  <path d="M434 116 L 454 116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="454" y="88" width="118" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="513" y="112" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">向量化</text>
  <text x="513" y="132" font-size="11" fill="#64748b" text-anchor="middle">Embedding 模型</text>
  <path d="M572 116 L 592 116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="592" y="88" width="128" height="56" rx="8" fill="#1d4ed8"/>
  <text x="656" y="112" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">存入向量库</text>
  <text x="656" y="132" font-size="11" fill="#dbeafe" text-anchor="middle">FAISS / Milvus 等</text>

  <text x="380" y="180" font-size="12" fill="#1e40af" text-anchor="middle">类比：提前把资料整理、编号、放进图书馆，并建好索引卡片</text>

  <!-- Stage 2: retrieval and generation -->
  <rect x="20" y="210" width="720" height="200" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <rect x="20" y="210" width="170" height="30" rx="10" fill="#0d9488"/>
  <text x="105" y="231" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">② 检索生成阶段（在线）</text>

  <rect x="40" y="254" width="112" height="56" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="96" y="278" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">用户提问</text>
  <text x="96" y="298" font-size="11" fill="#64748b" text-anchor="middle">Query</text>
  <path d="M152 282 L 172 282" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="172" y="254" width="112" height="56" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="228" y="278" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">问题向量化</text>
  <text x="228" y="298" font-size="11" fill="#64748b" text-anchor="middle">同一 Embedding</text>
  <path d="M284 282 L 304 282" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="304" y="254" width="112" height="56" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="360" y="278" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">向量检索</text>
  <text x="360" y="298" font-size="11" fill="#64748b" text-anchor="middle">召回 Top-K</text>
  <path d="M416 282 L 436 282" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="436" y="254" width="112" height="56" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="492" y="278" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">重排 Re-rank</text>
  <text x="492" y="298" font-size="11" fill="#64748b" text-anchor="middle">精排出最相关内容</text>
  <path d="M548 282 L 568 282" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>

  <rect x="568" y="254" width="152" height="56" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="644" y="278" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">拼接提示词</text>
  <text x="644" y="298" font-size="11" fill="#64748b" text-anchor="middle">问题 + 检索到的资料</text>

  <path d="M644 310 L 644 336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>
  <rect x="40" y="336" width="330" height="56" rx="8" fill="#0d9488"/>
  <text x="205" y="360" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">大模型基于资料生成回答</text>
  <text x="205" y="380" font-size="11" fill="#ccfbf1" text-anchor="middle">只能“参考”检索到的内容作答</text>
  <path d="M370 364 L 400 364" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr4)"/>
  <rect x="400" y="336" width="320" height="56" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="560" y="360" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">输出答案（可附来源引用）</text>
  <text x="560" y="380" font-size="11" fill="#64748b" text-anchor="middle">答非所问时可追溯、可纠正</text>

  <!-- Comparison -->
  <rect x="20" y="428" width="352" height="72" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="196" y="452" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">没有 RAG：模型“闭卷考试”</text>
  <text x="196" y="476" font-size="12" fill="#7f1d1d" text-anchor="middle">知识停留在训练截止日，易过时、易编造</text>
  <rect x="388" y="428" width="352" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="564" y="452" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">有了 RAG：模型“开卷考试”</text>
  <text x="564" y="476" font-size="12" fill="#14532d" text-anchor="middle">先查资料再作答，知识可更新、可溯源</text>

  <defs>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
