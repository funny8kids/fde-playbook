<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">微调与轻量化：四条技术路线怎么选</text>

  <!-- 四列 -->
  <rect x="20" y="46" width="172" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="106" y="70" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">全参微调 SFT</text>
  <text x="106" y="92" font-size="10" fill="#334155" text-anchor="middle">更新全部参数</text>
  <text x="106" y="110" font-size="10" fill="#334155" text-anchor="middle">效果上限最高</text>
  <text x="106" y="128" font-size="10" fill="#64748b" text-anchor="middle">需多卡、易灾难性遗忘</text>
  <text x="106" y="150" font-size="10" fill="#64748b" text-anchor="middle">中小企业不推荐</text>

  <rect x="202" y="46" width="172" height="120" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="288" y="70" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">LoRA / QLoRA</text>
  <text x="288" y="92" font-size="10" fill="#334155" text-anchor="middle">只训练低秩适配器</text>
  <text x="288" y="110" font-size="10" fill="#334155" text-anchor="middle">单卡可跑，成本低</text>
  <text x="288" y="128" font-size="10" fill="#64748b" text-anchor="middle">权重可插拔、易回滚</text>
  <text x="288" y="150" font-size="10" fill="#0f766e" text-anchor="middle">企业首选方案</text>

  <rect x="384" y="46" width="172" height="120" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="470" y="70" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">DPO / 偏好对齐</text>
  <text x="470" y="92" font-size="10" fill="#334155" text-anchor="middle">用「好/坏」成对数据</text>
  <text x="470" y="110" font-size="10" fill="#334155" text-anchor="middle">直接优化偏好</text>
  <text x="470" y="128" font-size="10" fill="#64748b" text-anchor="middle">比 RLHF 简单稳定</text>
  <text x="470" y="150" font-size="10" fill="#64748b" text-anchor="middle">需高质量偏好数据</text>

  <rect x="566" y="46" width="174" height="120" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="653" y="70" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">量化 / 蒸馏</text>
  <text x="653" y="92" font-size="10" fill="#334155" text-anchor="middle">INT8/INT4 压缩</text>
  <text x="653" y="110" font-size="10" fill="#334155" text-anchor="middle">显存降 50–75%</text>
  <text x="653" y="128" font-size="10" fill="#64748b" text-anchor="middle">精度损失 1–3%</text>
  <text x="653" y="150" font-size="10" fill="#9a3412" text-anchor="middle">私有化必做</text>

  <!-- 决策流程 -->
  <text x="380" y="196" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">先问三个问题，再决定要不要微调</text>

  <rect x="30" y="212" width="330" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="234" font-size="11" font-weight="bold" fill="#334155">Q1 缺的是知识还是行为？</text>
  <text x="46" y="254" font-size="10" fill="#64748b">知识 → RAG；行为/格式/语气 → 微调</text>

  <rect x="380" y="212" width="350" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="396" y="234" font-size="11" font-weight="bold" fill="#334155">Q2 提示词能做到 80 分吗？</text>
  <text x="396" y="254" font-size="10" fill="#64748b">能 → 先别微调；不能 → 再考虑</text>

  <rect x="30" y="280" width="330" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="302" font-size="11" font-weight="bold" fill="#334155">Q3 有 ≥1000 条高质量样本吗？</text>
  <text x="46" y="322" font-size="10" fill="#64748b">没有 → 先做数据，别急着训练</text>

  <rect x="380" y="280" width="350" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="396" y="302" font-size="11" font-weight="bold" fill="#b91c1c">三个都「是」才微调</text>
  <text x="396" y="322" font-size="10" fill="#7f1d1d">否则大概率白花钱，还会带来版本维护负担</text>

  <!-- 数据 -->
  <rect x="30" y="350" width="700" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="46" y="374" font-size="12" font-weight="bold" fill="#1e40af">微调数据的三条硬标准</text>
  <text x="46" y="398" font-size="11" fill="#334155">① 覆盖真实分布：从线上日志/工单里取，不要自己编；② 质量高于数量：500 条精标 &gt; 5000 条粗标；</text>
  <text x="46" y="420" font-size="11" fill="#334155">③ 留出验证集：训练/验证/测试 8:1:1，测试集绝不参与训练，否则指标虚高。</text>
</svg>
