<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">企业级部署参考架构：五层 + 一池</text>

  <!-- access -->
  <rect x="20" y="46" width="720" height="62" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="36" y="70" font-size="12" font-weight="bold" fill="#1e40af">接入层</text>
  <rect x="120" y="56" width="130" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="185" y="82" font-size="11" fill="#1e40af" text-anchor="middle">Web / 企微 / App</text>
  <rect x="262" y="56" width="130" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="327" y="82" font-size="11" fill="#1e40af" text-anchor="middle">API 网关 + 鉴权</text>
  <rect x="404" y="56" width="130" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="469" y="82" font-size="11" fill="#1e40af" text-anchor="middle">限流 / 熔断 / 审计</text>
  <rect x="546" y="56" width="170" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="631" y="82" font-size="11" fill="#1e40af" text-anchor="middle">内容安全过滤（输入侧）</text>

  <!-- app -->
  <rect x="20" y="118" width="720" height="62" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="36" y="142" font-size="12" font-weight="bold" fill="#0f766e">应用层</text>
  <rect x="120" y="128" width="150" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="195" y="154" font-size="11" fill="#0f766e" text-anchor="middle">会话与权限服务</text>
  <rect x="282" y="128" width="150" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="357" y="154" font-size="11" fill="#0f766e" text-anchor="middle">编排引擎（Agent）</text>
  <rect x="444" y="128" width="150" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="519" y="154" font-size="11" fill="#0f766e" text-anchor="middle">RAG 服务</text>
  <rect x="606" y="128" width="110" height="42" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="661" y="154" font-size="11" fill="#0f766e" text-anchor="middle">工具适配</text>

  <!-- model -->
  <rect x="20" y="190" width="720" height="76" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="36" y="214" font-size="12" font-weight="bold" fill="#9a3412">模型层</text>
  <rect x="120" y="200" width="150" height="56" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="195" y="222" font-size="11" fill="#9a3412" text-anchor="middle">推理服务 vLLM</text>
  <text x="195" y="240" font-size="10" fill="#64748b" text-anchor="middle">PagedAttention / 批处理</text>
  <rect x="282" y="200" width="150" height="56" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="357" y="222" font-size="11" fill="#9a3412" text-anchor="middle">Embedding 服务</text>
  <text x="357" y="240" font-size="10" fill="#64748b" text-anchor="middle">批量向量化</text>
  <rect x="444" y="200" width="150" height="56" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="519" y="222" font-size="11" fill="#9a3412" text-anchor="middle">Re-rank 服务</text>
  <text x="519" y="240" font-size="10" fill="#64748b" text-anchor="middle">精排 Top-N → Top-K</text>
  <rect x="606" y="200" width="110" height="56" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="661" y="222" font-size="11" fill="#9a3412" text-anchor="middle">外部 API</text>
  <text x="661" y="240" font-size="10" fill="#64748b" text-anchor="middle">备用 / 混合</text>

  <!-- gpu pool -->
  <rect x="20" y="276" width="720" height="52" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="36" y="300" font-size="12" font-weight="bold" fill="#5b21b6">算力池</text>
  <text x="130" y="300" font-size="11" fill="#5b21b6">GPU 节点（K8s Device Plugin 调度）· 显存隔离 · 弹性扩缩容 · 模型多版本共存</text>
  <text x="130" y="318" font-size="10" fill="#64748b">7B FP16 约 14GB 权重；INT4 量化后约 4GB，需另算 KV Cache 与并发余量</text>

  <!-- data -->
  <rect x="20" y="338" width="720" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="36" y="362" font-size="12" font-weight="bold" fill="#1e40af">数据层</text>
  <rect x="120" y="348" width="150" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="195" y="370" font-size="11" fill="#1e40af" text-anchor="middle">向量数据库</text>
  <text x="195" y="388" font-size="10" fill="#64748b" text-anchor="middle">Milvus / pgvector</text>
  <rect x="282" y="348" width="150" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="357" y="370" font-size="11" fill="#1e40af" text-anchor="middle">关系库 / 对象存储</text>
  <text x="357" y="388" font-size="10" fill="#64748b" text-anchor="middle">元数据 / 原文 / 日志</text>
  <rect x="444" y="348" width="150" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="519" y="370" font-size="11" fill="#1e40af" text-anchor="middle">缓存（Redis）</text>
  <text x="519" y="388" font-size="10" fill="#64748b" text-anchor="middle">语义缓存 / 会话</text>
  <rect x="606" y="348" width="110" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="661" y="370" font-size="11" fill="#1e40af" text-anchor="middle">备份与归档</text>
  <text x="661" y="388" font-size="10" fill="#64748b" text-anchor="middle">版本留痕</text>

  <!-- ops -->
  <rect x="20" y="424" width="720" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="452" font-size="12" font-weight="bold" fill="#475569">运维层：监控告警（时延 / 错误率 / Token 用量 / 显存）· 全链路 Trace · 审计日志 · 灰度发布 · 成本看板</text>
</svg>
