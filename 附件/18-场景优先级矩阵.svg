<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">场景优先级矩阵：先做哪一块</text>

  <!-- axes -->
  <line x1="100" y1="70" x2="100" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#a18)"/>
  <line x1="100" y1="370" x2="710" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#a18)"/>
  <text x="60" y="220" font-size="12" font-weight="bold" fill="#334155" transform="rotate(-90 60 220)">业务价值 →</text>
  <text x="405" y="400" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">落地可行性（数据 / 技术 / 组织）→</text>

  <!-- quadrants -->
  <rect x="100" y="70" width="305" height="150" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="405" y="70" width="305" height="150" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="100" y="220" width="305" height="150" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="405" y="220" width="305" height="150" fill="#fff7ed" stroke="#fed7aa"/>

  <text x="252" y="94" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">高价值 · 低可行 → 攻关 / 分期</text>
  <text x="252" y="116" font-size="10" fill="#166534" text-anchor="middle">先补数据、缩范围做 MVP</text>
  <text x="252" y="134" font-size="10" fill="#166534" text-anchor="middle">例：跨系统智能调度</text>
  <text x="252" y="152" font-size="10" fill="#166534" text-anchor="middle">例：全流程自动化决策</text>

  <text x="557" y="94" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">高价值 · 高可行 → 立即做</text>
  <text x="557" y="116" font-size="10" fill="#1e3a8a" text-anchor="middle">首发场景，做标杆、拿信任</text>
  <text x="557" y="134" font-size="10" fill="#1e3a8a" text-anchor="middle">例：制度问答、工单辅助</text>
  <text x="557" y="152" font-size="10" fill="#1e3a8a" text-anchor="middle">例：合同条款比对</text>

  <text x="252" y="244" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">低价值 · 低可行 → 不做</text>
  <text x="252" y="266" font-size="10" fill="#7f1d1d" text-anchor="middle">礼貌拒绝，避免消耗信任</text>
  <text x="252" y="284" font-size="10" fill="#7f1d1d" text-anchor="middle">例：为 3 人做的定制小工具</text>

  <text x="557" y="244" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">低价值 · 高可行 → 顺手做</text>
  <text x="557" y="266" font-size="10" fill="#7c2d12" text-anchor="middle">低成本快速交付，刷好感</text>
  <text x="557" y="284" font-size="10" fill="#7c2d12" text-anchor="middle">例：会议纪要整理</text>

  <rect x="100" y="70" width="610" height="300" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="380" y="422" font-size="11" fill="#64748b" text-anchor="middle">用法：把客户提的 10 个需求逐条打分（各 1–5 分），落位后决定建设顺序，方案里就写「一期做右上，二期攻左上」</text>

  <defs>
    <marker id="a18" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
