<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="452" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Agent 与 ReAct：让模型“思考—行动—观察”循环</text>

  <!-- Loop diagram -->
  <rect x="20" y="44" width="420" height="388" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="140" y="66" width="180" height="40" rx="20" fill="#1d4ed8"/>
  <text x="230" y="91" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">用户问题 / 任务</text>
  <path d="M230 106 L 230 130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr6)"/>

  <rect x="120" y="130" width="220" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="230" y="152" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">Thought 思考</text>
  <text x="230" y="172" font-size="11" fill="#64748b" text-anchor="middle">分析现状，决定下一步做什么</text>
  <path d="M340 156 L 372 156" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr6)"/>

  <rect x="372" y="130" width="220" height="52" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="482" y="152" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">Action 行动</text>
  <text x="482" y="172" font-size="11" fill="#64748b" text-anchor="middle">调用工具：搜索 / 数据库 / API</text>

  <path d="M482 182 L 482 220 L 230 220 L 230 246" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr6)"/>
  <rect x="120" y="246" width="220" height="52" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="230" y="268" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">Observation 观察</text>
  <text x="230" y="288" font-size="11" fill="#64748b" text-anchor="middle">获得工具返回的结果</text>

  <path d="M120 272 L 60 272 L 60 156 L 120 156" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr6)"/>
  <text x="66" y="220" font-size="11" fill="#64748b" transform="rotate(-90 66 220)">循环，直到信息足够</text>

  <path d="M230 298 L 230 326" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr6)"/>
  <rect x="140" y="326" width="180" height="40" rx="20" fill="#16a34a"/>
  <text x="230" y="351" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Final Answer 最终回答</text>

  <rect x="40" y="380" width="380" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="230" y="404" font-size="12" fill="#1e40af" text-anchor="middle">工具调用靠 Function Calling：模型按约定格式“发起请求”</text>

  <!-- Example trace -->
  <rect x="460" y="44" width="280" height="388" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="72" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">一次典型执行轨迹</text>

  <rect x="478" y="86" width="244" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="490" y="106" font-size="11" font-weight="bold" fill="#334155">用户：北京明天天气怎么样？</text>
  <text x="490" y="126" font-size="11" fill="#64748b">需要实时数据 → 模型自己不知道</text>

  <rect x="478" y="146" width="244" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="490" y="166" font-size="11" font-weight="bold" fill="#1e40af">Thought：需要调用天气工具</text>
  <text x="490" y="186" font-size="11" fill="#64748b">Action：get_weather(city="北京")</text>

  <rect x="478" y="206" width="244" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="490" y="226" font-size="11" font-weight="bold" fill="#0f766e">Observation：晴，18–26℃，微风</text>
  <text x="490" y="246" font-size="11" fill="#64748b">拿到真实数据，信息已足够</text>

  <rect x="478" y="266" width="244" height="64" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="490" y="288" font-size="11" font-weight="bold" fill="#15803d">Final Answer：北京明天晴，</text>
  <text x="490" y="306" font-size="11" fill="#15803d">气温 18–26℃，微风，适合出行。</text>
  <text x="490" y="324" font-size="11" fill="#64748b">回答有事实来源，而非凭空编造</text>

  <rect x="478" y="346" width="244" height="70" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="490" y="366" font-size="11" font-weight="bold" fill="#92400e">配套考点</text>
  <text x="490" y="384" font-size="10" fill="#78350f">· 记忆管理：短期上下文 + 长期记忆</text>
  <text x="490" y="400" font-size="10" fill="#78350f">· 安全护栏：限制可调用的工具与权限</text>

  <defs>
    <marker id="arr6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
