<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">企业 AI 合规地图：五部法规对应七个动作</text>

  <!-- laws -->
  <rect x="20" y="46" width="352" height="196" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="40" y="70" font-size="12" font-weight="bold" fill="#1e40af">法规依据</text>

  <rect x="36" y="82" width="320" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="48" y="101" font-size="10" fill="#1e40af">网络安全法 · 2017-06-01</text>
  <rect x="36" y="114" width="320" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="48" y="133" font-size="10" fill="#1e40af">数据安全法 · 2021-09-01</text>
  <rect x="36" y="146" width="320" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="48" y="165" font-size="10" fill="#1e40af">个人信息保护法 · 2021-11-01</text>
  <rect x="36" y="178" width="320" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="48" y="197" font-size="10" fill="#1e40af">生成式人工智能服务管理暂行办法 · 2023-08-15</text>
  <rect x="36" y="210" width="320" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="48" y="229" font-size="10" fill="#1e40af">人工智能生成合成内容标识办法 · 2025-09-01</text>

  <!-- actions -->
  <rect x="388" y="46" width="352" height="196" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="408" y="70" font-size="12" font-weight="bold" fill="#15803d">落地动作</text>
  <text x="408" y="96" font-size="11" fill="#14532d">① 数据来源合法性审查</text>
  <text x="408" y="120" font-size="11" fill="#14532d">② 个人信息告知同意 + 脱敏去标识</text>
  <text x="408" y="144" font-size="11" fill="#14532d">③ 输入输出内容安全过滤</text>
  <text x="408" y="168" font-size="11" fill="#14532d">④ 生成内容显式 / 隐式标识</text>
  <text x="408" y="192" font-size="11" fill="#14532d">⑤ 算法备案（具舆论属性时）</text>
  <text x="408" y="216" font-size="11" fill="#14532d">⑥ 等级保护测评（常见二级/三级）</text>
  <text x="408" y="238" font-size="11" fill="#14532d">⑦ 日志留存 + 审计 + 应急处置</text>

  <!-- timeline -->
  <rect x="20" y="258" width="720" height="96" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="36" y="282" font-size="12" font-weight="bold" fill="#5b21b6">项目各阶段该做什么</text>
  <text x="36" y="306" font-size="11" fill="#334155">立项：数据来源审查、个人信息影响评估 → 设计：权限与脱敏方案、内容安全策略</text>
  <text x="36" y="328" font-size="11" fill="#334155">开发：标识字段、审计日志、过滤规则 → 上线：等保测评、算法备案（如适用）、应急演练</text>
  <text x="36" y="348" font-size="11" fill="#334155">运营：投诉受理、内容抽检、法规跟踪</text>

  <rect x="20" y="370" width="720" height="70" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="394" font-size="12" font-weight="bold" fill="#b91c1c">三个常见误判</text>
  <text x="40" y="416" font-size="11" fill="#7f1d1d">① 「私有化 = 合规」→ 错，行为义务仍在；② 「内部系统不用标识」→ 错，对外输出仍可能需标识；</text>
  <text x="40" y="436" font-size="11" fill="#7f1d1d">③ 「开源模型没责任」→ 错，服务提供者仍是责任主体。</text>
</svg>
