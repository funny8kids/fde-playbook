<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="540" fill="#fbfcfe"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#1e293b">干系人地图：五类人，五种语言</text>
  <text x="24" y="52" font-size="11.5" fill="#64748b">横轴＝对项目结果的影响程度，纵轴＝对项目成败的权力；先看清位置，再决定说什么</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="440" x2="620" y2="440" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="80" y1="440" x2="80" y2="96" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="350" y="466" font-size="11" fill="#64748b" text-anchor="middle">影响程度（结果被影响多少）→</text>
  <text x="44" y="270" font-size="11" fill="#64748b" transform="rotate(-90 44 270)" text-anchor="middle">权力（能不能一票否决）→</text>

  <!-- 网格 -->
  <line x1="350" y1="96" x2="350" y2="440" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="268" x2="620" y2="268" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 象限标签 -->
  <text x="96" y="118" font-size="10.5" fill="#94a3b8">权力高 · 影响小：保持满意</text>
  <text x="606" y="118" font-size="10.5" fill="#94a3b8" text-anchor="end">权力高 · 影响大：重点管理</text>
  <text x="96" y="430" font-size="10.5" fill="#94a3b8">权力低 · 影响小：定期告知</text>
  <text x="606" y="430" font-size="10.5" fill="#94a3b8" text-anchor="end">权力低 · 影响大：随时同步</text>

  <!-- 决策者 -->
  <rect x="404" y="128" width="196" height="96" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="420" y="150" font-size="12.5" font-weight="700" fill="#991b1b">决策者（出钱的）</text>
  <text x="420" y="170" font-size="10.5" fill="#334155">关心：投入产出、风险、能不能对外讲</text>
  <text x="420" y="188" font-size="10.5" fill="#334155">语言：钱 / 时间 / 最坏情况</text>
  <text x="420" y="206" font-size="10.5" fill="#b45309">节奏：里程碑汇报，5–8 页</text>
  <text x="420" y="220" font-size="10" fill="#64748b">开场问：做成后您最想在哪份材料里写它？</text>

  <!-- 看门人 -->
  <rect x="104" y="128" width="200" height="96" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="120" y="150" font-size="12.5" font-weight="700" fill="#92400e">看门人（IT/安全/法务）</text>
  <text x="120" y="170" font-size="10.5" fill="#334155">关心：会不会出事、合不合规、能否运维</text>
  <text x="120" y="188" font-size="10.5" fill="#334155">语言：清单 / 条款 / 责任边界</text>
  <text x="120" y="206" font-size="10.5" fill="#b45309">最容易犯：最后才找他们</text>
  <text x="120" y="220" font-size="10" fill="#64748b">开场问：上线需要我提供哪些材料？</text>

  <!-- 业务负责人 -->
  <rect x="404" y="286" width="196" height="96" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="420" y="308" font-size="12.5" font-weight="700" fill="#166534">业务负责人（用结果的）</text>
  <text x="420" y="328" font-size="10.5" fill="#334155">关心：指标能不能改善、他的 KPI</text>
  <text x="420" y="346" font-size="10.5" fill="#334155">语言：他的指标怎么变</text>
  <text x="420" y="364" font-size="10.5" fill="#b45309">节奏：每两周一次</text>
  <text x="420" y="378" font-size="10" fill="#64748b">开场问：这步谁在做、一天几次、错一次怎样？</text>

  <!-- 使用者 -->
  <rect x="104" y="286" width="200" height="96" rx="9" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.3"/>
  <text x="120" y="308" font-size="12.5" font-weight="700" fill="#155e75">使用者（天天点的）</text>
  <text x="120" y="328" font-size="10.5" fill="#334155">关心：会不会加我的活、错了谁负责</text>
  <text x="120" y="346" font-size="10.5" fill="#334155">语言：操作步骤 + 兜底方案</text>
  <text x="120" y="364" font-size="10.5" fill="#b45309">试点期：每周</text>
  <text x="120" y="378" font-size="10" fill="#64748b">别指望他们打开一个 App——入口要贴在现场</text>

  <!-- 阻碍者 -->
  <rect x="240" y="404" width="200" height="0" fill="none"/>
  <rect x="470" y="404" width="130" height="0" fill="none"/>
  <rect x="230" y="188" width="120" height="0" fill="none"/>

  <!-- 阻碍者单独标注 -->
  <rect x="246" y="176" width="120" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="306" y="198" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">阻碍者（隐性）</text>
  <text x="306" y="216" font-size="10" fill="#475569" text-anchor="middle">项目成功会让他难堪</text>
  <text x="306" y="232" font-size="10" fill="#475569" text-anchor="middle">或失去资源</text>
  <text x="306" y="246" font-size="10" fill="#b45309" text-anchor="middle">对策：给参与感 + 一块功劳</text>

  <!-- 底部要点 -->
  <rect x="80" y="480" width="540" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="96" y="505" font-size="11.5" fill="#3730a3">至少三条独立通道：决策者要资源 · 业务要场景 · IT 要数据与上线许可——只对接一个人是失败的开始</text>

  <text x="24" y="532" font-size="10.5" fill="#94a3b8">图 20-1　干系人权力-影响矩阵（章号对应正文第 20 章）</text>
</svg>
