<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">FDE 能力模型：一横一竖的「T 型」结构</text>

  <!-- vertical bar -->
  <rect x="330" y="52" width="100" height="250" rx="10" fill="#1d4ed8"/>
  <text x="380" y="80" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">技术深度</text>
  <text x="380" y="106" font-size="11" fill="#dbeafe" text-anchor="middle">大模型原理</text>
  <text x="380" y="128" font-size="11" fill="#dbeafe" text-anchor="middle">RAG 工程</text>
  <text x="380" y="150" font-size="11" fill="#dbeafe" text-anchor="middle">Agent 编排</text>
  <text x="380" y="172" font-size="11" fill="#dbeafe" text-anchor="middle">检索与重排调优</text>
  <text x="380" y="194" font-size="11" fill="#dbeafe" text-anchor="middle">成本与性能测算</text>
  <text x="380" y="216" font-size="11" fill="#dbeafe" text-anchor="middle">容器化与推理部署</text>
  <text x="380" y="238" font-size="11" fill="#dbeafe" text-anchor="middle">评测体系与 Bad Case</text>
  <text x="380" y="260" font-size="11" fill="#dbeafe" text-anchor="middle">安全与合规</text>
  <text x="380" y="286" font-size="11" fill="#bfdbfe" text-anchor="middle">— 决定方案「能不能做成」</text>

  <!-- horizontal bar -->
  <rect x="60" y="302" width="640" height="76" rx="10" fill="#0d9488"/>
  <text x="380" y="328" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">业务广度</text>
  <text x="380" y="352" font-size="11" fill="#ccfbf1" text-anchor="middle">行业知识 · 需求调研 · 价值量化 · 方案写作 · 商务沟通 · 交付管理</text>
  <text x="380" y="370" font-size="11" fill="#99f6e4" text-anchor="middle">— 决定方案「值不值得做、客户买不买单」</text>

  <!-- callouts -->
  <rect x="40" y="52" width="270" height="112" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="76" font-size="12" font-weight="bold" fill="#1e40af">只深不广（纯技术）</text>
  <text x="56" y="98" font-size="11" fill="#334155">能做出 demo，讲不清价值，</text>
  <text x="56" y="116" font-size="11" fill="#334155">过不了客户评审，方案卖不动。</text>
  <text x="56" y="142" font-size="11" fill="#64748b">典型：算法工程师转售前</text>

  <rect x="450" y="52" width="270" height="112" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="466" y="76" font-size="12" font-weight="bold" fill="#9a3412">只广不深（纯商务）</text>
  <text x="466" y="98" font-size="11" fill="#334155">方案写得漂亮，一上 POC</text>
  <text x="466" y="116" font-size="11" fill="#334155">就崩：效果、成本、时延全不达标。</text>
  <text x="466" y="142" font-size="11" fill="#64748b">典型：传统售前转 AI</text>

  <rect x="40" y="180" width="270" height="112" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="56" y="204" font-size="12" font-weight="bold" fill="#15803d">FDE 的核心竞争力</text>
  <text x="56" y="226" font-size="11" fill="#334155">把「模型能力」翻译成「业务收益」，</text>
  <text x="56" y="244" font-size="11" fill="#334155">再把「业务收益」落成「可交付系统」。</text>
  <text x="56" y="270" font-size="11" fill="#64748b">技术可信 + 商业可算 + 工程可交付</text>

  <rect x="450" y="180" width="270" height="112" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="466" y="204" font-size="12" font-weight="bold" fill="#5b21b6">考核怎么考这三层</text>
  <text x="466" y="226" font-size="11" fill="#334155">单选：技术概念与参数细节</text>
  <text x="466" y="244" font-size="11" fill="#334155">简答：给场景，要方案与风险</text>
  <text x="466" y="270" font-size="11" fill="#64748b">本质是在考「T 型的交叉点」</text>
</svg>
