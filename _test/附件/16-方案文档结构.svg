<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">一份能过评审的 AI 解决方案文档：12 个章节</text>

  <rect x="30" y="46" width="340" height="52" rx="8" fill="#1d4ed8"/>
  <text x="46" y="68" font-size="12" font-weight="bold" fill="#ffffff">1. 项目背景与业务目标</text>
  <text x="46" y="86" font-size="10" fill="#dbeafe">现状、痛点量化、目标指标（可验收）</text>

  <rect x="390" y="46" width="340" height="52" rx="8" fill="#2563eb"/>
  <text x="406" y="68" font-size="12" font-weight="bold" fill="#ffffff">2. 需求分析与范围界定</text>
  <text x="406" y="86" font-size="10" fill="#dbeafe">做什么 / 不做什么、用户角色、使用频次</text>

  <rect x="30" y="106" width="340" height="52" rx="8" fill="#0d9488"/>
  <text x="46" y="128" font-size="12" font-weight="bold" fill="#ffffff">3. 场景拆解与优先级</text>
  <text x="46" y="146" font-size="10" fill="#ccfbf1">价值 × 可行性矩阵、分期建设路径</text>

  <rect x="390" y="106" width="340" height="52" rx="8" fill="#14b8a6"/>
  <text x="406" y="128" font-size="12" font-weight="bold" fill="#ffffff">4. 总体技术架构</text>
  <text x="406" y="146" font-size="10" fill="#ccfbf1">分层架构图、数据流、部署拓扑</text>

  <rect x="30" y="166" width="340" height="52" rx="8" fill="#7c3aed"/>
  <text x="46" y="188" font-size="12" font-weight="bold" fill="#ffffff">5. 关键技术方案</text>
  <text x="46" y="206" font-size="10" fill="#ede9fe">RAG / Agent / 提示词 / 模型选型理由</text>

  <rect x="390" y="166" width="340" height="52" rx="8" fill="#8b5cf6"/>
  <text x="406" y="188" font-size="12" font-weight="bold" fill="#ffffff">6. 数据方案与治理</text>
  <text x="406" y="206" font-size="10" fill="#ede9fe">数据源清单、清洗规则、更新与权限</text>

  <rect x="30" y="226" width="340" height="52" rx="8" fill="#ea580c"/>
  <text x="46" y="248" font-size="12" font-weight="bold" fill="#ffffff">7. 部署与集成方案</text>
  <text x="46" y="266" font-size="10" fill="#ffedd5">公有云 / 私有化、与现有系统对接</text>

  <rect x="390" y="226" width="340" height="52" rx="8" fill="#f97316"/>
  <text x="406" y="248" font-size="12" font-weight="bold" fill="#ffffff">8. 效果评估与验收标准</text>
  <text x="406" y="266" font-size="10" fill="#ffedd5">指标定义、测试集、验收流程</text>

  <rect x="30" y="286" width="340" height="52" rx="8" fill="#dc2626"/>
  <text x="46" y="308" font-size="12" font-weight="bold" fill="#ffffff">9. 项目实施计划</text>
  <text x="46" y="326" font-size="10" fill="#fee2e2">里程碑、人力投入、客户配合事项</text>

  <rect x="390" y="286" width="340" height="52" rx="8" fill="#ef4444"/>
  <text x="406" y="308" font-size="12" font-weight="bold" fill="#ffffff">10. 成本测算与报价</text>
  <text x="406" y="326" font-size="10" fill="#fee2e2">一次性 + 年运营、成本敏感度分析</text>

  <rect x="30" y="346" width="340" height="52" rx="8" fill="#64748b"/>
  <text x="46" y="368" font-size="12" font-weight="bold" fill="#ffffff">11. 风险与应对</text>
  <text x="46" y="386" font-size="10" fill="#e2e8f0">技术 / 合规 / 组织 / 供应商四类风险</text>

  <rect x="390" y="346" width="340" height="52" rx="8" fill="#475569"/>
  <text x="406" y="368" font-size="12" font-weight="bold" fill="#ffffff">12. 运维与持续运营</text>
  <text x="406" y="386" font-size="10" fill="#e2e8f0">监控、Bad Case 闭环、迭代节奏、培训</text>

  <rect x="30" y="412" width="700" height="44" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="380" y="432" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">评审最常被打回的三个位置：目标不可验收（1）、指标没定义（8）、成本没算清（10）</text>
  <text x="380" y="448" font-size="10" fill="#78350f" text-anchor="middle">简答题写方案时，按这 12 章的顺序组织，天然就是结构化答案</text>
</svg>
