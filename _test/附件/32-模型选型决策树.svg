<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="600" fill="#fbfcfe"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#1e293b">模型选型决策树：先做减法，再做加法</text>
  <text x="24" y="52" font-size="11.5" fill="#64748b">前两层是一票否决（合规 / 可控），后两层才比能力与成本</text>

  <!-- 起点 -->
  <rect x="250" y="70" width="180" height="44" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="340" y="97" font-size="12.5" fill="#3730a3" text-anchor="middle" font-weight="600">① 数据能否出内网？</text>

  <line x1="300" y1="114" x2="190" y2="146" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a32)"/>
  <text x="228" y="132" font-size="11" fill="#b91c1c">否</text>
  <line x1="380" y1="114" x2="490" y2="146" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a32)"/>
  <text x="432" y="132" font-size="11" fill="#15803d">是</text>

  <!-- 左：私有化 -->
  <rect x="90" y="150" width="200" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="190" y="170" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="600">私有化：显存预算多少？</text>
  <text x="190" y="186" font-size="10.5" fill="#7f1d1d" text-anchor="middle">权重 + KV + 1~2GB</text>

  <!-- 右：API -->
  <rect x="390" y="150" width="200" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="490" y="170" font-size="12" fill="#166534" text-anchor="middle" font-weight="600">可用 API：任务有多难？</text>
  <text x="490" y="186" font-size="10.5" fill="#14532d" text-anchor="middle">按任务类型分，不按总分</text>

  <line x1="140" y1="194" x2="110" y2="228" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a32)"/>
  <line x1="240" y1="194" x2="280" y2="228" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a32)"/>
  <line x1="440" y1="194" x2="400" y2="228" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a32)"/>
  <line x1="540" y1="194" x2="580" y2="228" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a32)"/>

  <!-- 四个叶子 -->
  <rect x="30" y="232" width="150" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="105" y="252" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">单卡 24G</text>
  <text x="105" y="270" font-size="10.5" fill="#475569" text-anchor="middle">7B / 14B INT4</text>
  <text x="105" y="286" font-size="10.5" fill="#64748b" text-anchor="middle">先做 12 个高频型号</text>

  <rect x="200" y="232" width="150" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="275" y="252" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">多卡 / 大显存</text>
  <text x="275" y="270" font-size="10.5" fill="#475569" text-anchor="middle">14B / 32B INT4</text>
  <text x="275" y="286" font-size="10.5" fill="#64748b" text-anchor="middle">装得下用副本，不是并行</text>

  <rect x="370" y="232" width="150" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="445" y="252" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">简单 / 高频</text>
  <text x="445" y="270" font-size="10.5" fill="#475569" text-anchor="middle">小杯 + 语义缓存</text>
  <text x="445" y="286" font-size="10.5" fill="#64748b" text-anchor="middle">分类、抽取、路由</text>

  <rect x="540" y="232" width="150" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="615" y="252" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">复杂 / 低频</text>
  <text x="615" y="270" font-size="10.5" fill="#475569" text-anchor="middle">中杯 / 旗舰</text>
  <text x="615" y="286" font-size="10.5" fill="#64748b" text-anchor="middle">规划、多步推理</text>

  <!-- 汇合 -->
  <line x1="105" y1="294" x2="200" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="275" y1="294" x2="290" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="445" y1="294" x2="390" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="615" y1="294" x2="480" y2="340" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="170" y="344" width="340" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="340" y="366" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">② 用自建 50 题评测集横向打分</text>
  <text x="340" y="385" font-size="10.5" fill="#78350f" text-anchor="middle">得分率 ≥0.80 且幻觉率 ≤0.05 可用；差距 &lt;0.05 按成本选</text>

  <line x1="340" y1="396" x2="340" y2="424" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a32)"/>

  <rect x="170" y="428" width="340" height="52" rx="8" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.4"/>
  <text x="340" y="450" font-size="12.5" font-weight="700" fill="#155e75" text-anchor="middle">③ 定生产结构：分级路由 + 降级链</text>
  <text x="340" y="469" font-size="10.5" fill="#164e63" text-anchor="middle">小 / 中 / 旗舰分级；主 → 备 → 小 → 静态话术</text>

  <line x1="340" y1="480" x2="340" y2="508" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a32)"/>

  <rect x="230" y="512" width="220" height="44" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="340" y="539" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">固定版本号 + 回归测试</text>

  <text x="24" y="584" font-size="10.5" fill="#94a3b8">图 8-1　选型的四个层次：合规 → 可控 → 能力 → 成本结构（章号对应正文第 8 章）</text>
</svg>
