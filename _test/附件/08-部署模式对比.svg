<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">两种部署模式怎么选</text>

  <!-- headers -->
  <rect x="150" y="48" width="295" height="44" rx="10" fill="#2563eb"/>
  <text x="297" y="76" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">公有云 API 部署</text>
  <rect x="455" y="48" width="295" height="44" rx="10" fill="#7c3aed"/>
  <text x="602" y="76" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">私有化部署（本地 GPU）</text>

  <!-- rows -->
  <rect x="20" y="100" width="130" height="52" rx="8" fill="#f1f5f9"/>
  <text x="85" y="131" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">数据安全</text>
  <rect x="150" y="100" width="295" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="297" y="122" font-size="11" fill="#1e40af" text-anchor="middle">数据需发送到第三方云端</text>
  <text x="297" y="140" font-size="11" fill="#1e40af" text-anchor="middle">敏感数据需脱敏或签协议</text>
  <rect x="455" y="100" width="295" height="52" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="602" y="122" font-size="11" fill="#5b21b6" text-anchor="middle">数据不出企业内网</text>
  <text x="602" y="140" font-size="11" fill="#5b21b6" text-anchor="middle">金融、政务、医疗首选</text>

  <rect x="20" y="160" width="130" height="52" rx="8" fill="#f1f5f9"/>
  <text x="85" y="191" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">成本结构</text>
  <rect x="150" y="160" width="295" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="297" y="182" font-size="11" fill="#1e40af" text-anchor="middle">按 Token 用量付费，零起步成本</text>
  <text x="297" y="200" font-size="11" fill="#1e40af" text-anchor="middle">用量越大越贵</text>
  <rect x="455" y="160" width="295" height="52" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="602" y="182" font-size="11" fill="#5b21b6" text-anchor="middle">一次性投入 GPU 服务器</text>
  <text x="602" y="200" font-size="11" fill="#5b21b6" text-anchor="middle">调用量大时更划算</text>

  <rect x="20" y="220" width="130" height="52" rx="8" fill="#f1f5f9"/>
  <text x="85" y="251" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">启动与运维</text>
  <rect x="150" y="220" width="295" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="297" y="242" font-size="11" fill="#1e40af" text-anchor="middle">开通即用，上线快</text>
  <text x="297" y="260" font-size="11" fill="#1e40af" text-anchor="middle">免运维，模型自动升级</text>
  <rect x="455" y="220" width="295" height="52" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="602" y="242" font-size="11" fill="#5b21b6" text-anchor="middle">需采购、部署、调优</text>
  <text x="602" y="260" font-size="11" fill="#5b21b6" text-anchor="middle">需专业运维团队</text>

  <rect x="20" y="280" width="130" height="52" rx="8" fill="#f1f5f9"/>
  <text x="85" y="311" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">能力上限</text>
  <rect x="150" y="280" width="295" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="297" y="302" font-size="11" fill="#1e40af" text-anchor="middle">可用最强商用模型</text>
  <text x="297" y="320" font-size="11" fill="#1e40af" text-anchor="middle">能力随厂商更新</text>
  <rect x="455" y="280" width="295" height="52" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="602" y="302" font-size="11" fill="#5b21b6" text-anchor="middle">受限于本地显存与算力</text>
  <text x="602" y="320" font-size="11" fill="#5b21b6" text-anchor="middle">可量化、蒸馏小型化</text>

  <rect x="20" y="344" width="730" height="40" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="385" y="369" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">选型口诀：看数据敏感度、看调用量、看预算、看运维能力——没有最好，只有最合适</text>
</svg>
