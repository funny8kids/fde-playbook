<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">权限架构：知识库最容易翻车的地方</text>

  <!-- flow -->
  <rect x="20" y="50" width="130" height="64" rx="8" fill="#1d4ed8"/>
  <text x="85" y="76" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">用户身份</text>
  <text x="85" y="96" font-size="10" fill="#dbeafe" text-anchor="middle">账号 / 部门 / 职级</text>
  <path d="M150 82 L 180 82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a20)"/>

  <rect x="180" y="50" width="130" height="64" rx="8" fill="#0d9488"/>
  <text x="245" y="76" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">鉴权服务</text>
  <text x="245" y="96" font-size="10" fill="#ccfbf1" text-anchor="middle">生成 ACL 过滤条件</text>
  <path d="M310 82 L 340 82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a20)"/>

  <rect x="340" y="50" width="150" height="64" rx="8" fill="#7c3aed"/>
  <text x="415" y="76" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">检索时过滤</text>
  <text x="415" y="96" font-size="10" fill="#ede9fe" text-anchor="middle">向量检索 + 元数据 filter</text>
  <path d="M490 82 L 520 82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a20)"/>

  <rect x="520" y="50" width="130" height="64" rx="8" fill="#ea580c"/>
  <text x="585" y="76" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">结果二次校验</text>
  <text x="585" y="96" font-size="10" fill="#ffedd5" text-anchor="middle">越权内容丢弃</text>
  <path d="M650 82 L 680 82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a20)"/>

  <rect x="680" y="50" width="60" height="64" rx="8" fill="#16a34a"/>
  <text x="710" y="76" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">生成</text>
  <text x="710" y="96" font-size="10" fill="#dcfce7" text-anchor="middle">作答</text>

  <!-- chunk example -->
  <text x="20" y="152" font-size="12" font-weight="bold" fill="#334155">每个文本块必须带的元数据</text>
  <rect x="20" y="164" width="720" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="186" font-size="11" fill="#334155">doc_id · 标题 · 章节 · 页码 · 生效日期 · 版本 · 部门标签 · 密级 · 可见角色 · 租户 ID</text>
  <text x="36" y="206" font-size="10" fill="#64748b">缺一个「密级」，就可能把高管薪酬表答给实习生——这是真实项目里最常见的严重事故</text>

  <!-- wrong vs right -->
  <rect x="20" y="232" width="352" height="120" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="256" font-size="12" font-weight="bold" fill="#b91c1c">错误做法：先检索后过滤</text>
  <text x="40" y="278" font-size="11" fill="#7f1d1d">取 Top-5 之后才判断权限 →</text>
  <text x="40" y="296" font-size="11" fill="#7f1d1d">无权限的内容已占掉名额，</text>
  <text x="40" y="314" font-size="11" fill="#7f1d1d">有权限的内容被挤出，答案变差；</text>
  <text x="40" y="336" font-size="11" fill="#7f1d1d">极端情况下内容已进入提示词。</text>

  <rect x="388" y="232" width="352" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="408" y="256" font-size="12" font-weight="bold" fill="#15803d">正确做法：检索即过滤</text>
  <text x="408" y="278" font-size="11" fill="#14532d">把权限条件下推到向量库的</text>
  <text x="408" y="296" font-size="11" fill="#14532d">元数据 filter 中（pre-filter），</text>
  <text x="408" y="314" font-size="11" fill="#14532d">只召回用户可见的块；</text>
  <text x="408" y="336" font-size="11" fill="#14532d">生成前再做一次结果校验兜底。</text>

  <rect x="20" y="366" width="720" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="380" y="390" font-size="11" fill="#1e40af" text-anchor="middle">答题金句：权限不是「功能」，是「架构约束」——它必须出现在索引设计阶段，而不是上线前补丁</text>

  <defs>
    <marker id="a20" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
