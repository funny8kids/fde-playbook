<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="700" fill="#fbfcfe"/>

  <text x="24" y="34" font-size="19" font-weight="700" fill="#1e293b">FDE 知识体系全景图</text>
  <text x="24" y="56" font-size="12" fill="#64748b">五层能力自下而上支撑 · 一条案例主线横向验证 · 两套工具收口</text>

  <!-- 左侧能力方向 -->
  <line x1="30" y1="470" x2="30" y2="100" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="20" y="290" font-size="11" fill="#64748b" transform="rotate(-90 20 290)" text-anchor="middle">能力递进：越往上越接近客户与结果</text>

  <!-- L1 底座层 -->
  <rect x="52" y="418" width="512" height="58" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="68" y="440" font-size="12.5" font-weight="700" fill="#3730a3">底座层 · 模型与提示</text>
  <text x="68" y="462" font-size="11.5" fill="#334155">04 大模型原理与参数　05 提示词工程　06 微调与轻量化　07 多模态　08 模型选型评测</text>

  <!-- L2 数据层 -->
  <rect x="82" y="338" width="452" height="58" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.2"/>
  <text x="98" y="360" font-size="12.5" font-weight="700" fill="#155e75">数据层 · 解析与检索</text>
  <text x="98" y="382" font-size="11.5" fill="#334155">09 文档解析与数据工程　10 RAG 工程实践　11 检索进阶与 GraphRAG　12 RAG 评测</text>

  <!-- L3 智能层 -->
  <rect x="112" y="258" width="392" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="128" y="280" font-size="12.5" font-weight="700" fill="#166534">智能层 · Agent 与工具</text>
  <text x="128" y="302" font-size="11.5" fill="#334155">13 Agent 工程实践　14 工具设计与集成　15 Agent 评测与安全　16 多智能体编排</text>

  <!-- L4 交付层 -->
  <rect x="142" y="178" width="332" height="58" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="158" y="200" font-size="12.5" font-weight="700" fill="#92400e">交付层 · 方案与商务</text>
  <text x="158" y="222" font-size="11.5" fill="#334155">17 方案设计　18 价值量化　19 POC 交付　20 项目推进　21 文档写作　22 报价投标</text>

  <!-- L5 工程合规层 -->
  <rect x="172" y="98" width="272" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="188" y="120" font-size="12.5" font-weight="700" fill="#991b1b">保障层 · 工程与合规</text>
  <text x="188" y="142" font-size="11.5" fill="#334155">23 工程落地运维　24 部署容量　25 安全合规　26 数据治理</text>

  <!-- 右侧案例主线 -->
  <rect x="584" y="98" width="76" height="378" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="622" y="126" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">案例主线</text>
  <text x="622" y="150" font-size="10.5" fill="#64748b" text-anchor="middle">27 制造</text>
  <text x="622" y="172" font-size="10.5" fill="#64748b" text-anchor="middle">28 金融</text>
  <text x="622" y="194" font-size="10.5" fill="#64748b" text-anchor="middle">29 电商</text>
  <text x="622" y="216" font-size="10.5" fill="#64748b" text-anchor="middle">30 政务</text>
  <text x="622" y="238" font-size="10.5" fill="#64748b" text-anchor="middle">31 研发</text>
  <text x="622" y="260" font-size="10.5" fill="#64748b" text-anchor="middle">32 医教</text>
  <text x="622" y="288" font-size="10.5" fill="#64748b" text-anchor="middle">33 横向</text>
  <text x="622" y="310" font-size="10.5" fill="#64748b" text-anchor="middle">对比复盘</text>
  <line x1="622" y1="330" x2="622" y2="452" stroke="#cbd5e1" stroke-width="1"/>
  <text x="622" y="372" font-size="10.5" fill="#94a3b8" text-anchor="middle">每一层能力</text>
  <text x="622" y="392" font-size="10.5" fill="#94a3b8" text-anchor="middle">都在案例里</text>
  <text x="622" y="412" font-size="10.5" fill="#94a3b8" text-anchor="middle">被检验一次</text>

  <!-- 收口：两套工具 -->
  <rect x="52" y="506" width="246" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="68" y="528" font-size="12.5" font-weight="700" fill="#1e293b">收口一 · 应试工具</text>
  <text x="68" y="550" font-size="11.5" fill="#475569">01–03 认知与策略　34–37 题库与速记</text>

  <rect x="318" y="506" width="246" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="334" y="528" font-size="12.5" font-weight="700" fill="#1e293b">收口二 · 职业工具</text>
  <text x="334" y="550" font-size="11.5" fill="#475569">38 面试跃迁　39 知识体系　40–43 附录</text>

  <!-- 底部说明 -->
  <line x1="52" y1="596" x2="564" y2="596" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="618" font-size="11" fill="#64748b">读法建议：零基础自下而上（04 → 17），有技术底子自上而下（17 → 04 查漏），考前只看收口一。</text>
  <text x="52" y="638" font-size="11" fill="#64748b">判断是否学会的唯一标准：能不能在约束（内网 / 预算 / 工期 / 合规）改变时，重新推出方案。</text>
  <text x="52" y="664" font-size="10.5" fill="#94a3b8">图 0-1　全书知识地图（章号与正文一致，可对照目录跳读）</text>
</svg>
