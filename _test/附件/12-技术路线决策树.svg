<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">技术路线决策树：提示词 / RAG / 微调 / Agent 怎么选</text>

  <rect x="280" y="46" width="200" height="48" rx="24" fill="#1e293b"/>
  <text x="380" y="76" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">拿到一个业务需求</text>
  <path d="M380 94 L 380 112" stroke="#64748b" stroke-width="1.5" marker-end="url(#a12)"/>

  <rect x="250" y="112" width="260" height="52" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="380" y="134" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">① 模型本身「会做」这件事吗？</text>
  <text x="380" y="152" font-size="11" fill="#64748b">（能力问题：会不会写、会不会推理）</text>

  <path d="M250 138 L 130 138 L 130 186" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#a12)"/>
  <text x="150" y="132" font-size="11" fill="#16a34a">会，但输出不稳定</text>
  <rect x="40" y="186" width="180" height="92" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="130" y="210" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">提示词工程</text>
  <text x="130" y="232" font-size="10" fill="#334155" text-anchor="middle">结构化提示 + Few-shot</text>
  <text x="130" y="248" font-size="10" fill="#334155" text-anchor="middle">+ CoT + 输出格式约束</text>
  <text x="130" y="268" font-size="10" fill="#64748b" text-anchor="middle">成本最低，当天可验证</text>

  <path d="M380 164 L 380 186" stroke="#64748b" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="392" y="180" font-size="11" fill="#dc2626">不会 / 不知道</text>
  <rect x="250" y="186" width="260" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="380" y="208" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">② 缺的是「知识」还是「实时数据」？</text>
  <text x="380" y="228" font-size="11" fill="#64748b">知识 = 文档制度；实时 = 库存、订单、天气</text>

  <path d="M250 214 L 130 214 L 130 214" stroke="#64748b" stroke-width="0"/>
  <path d="M290 242 L 200 242 L 200 300" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#a12)"/>
  <text x="206" y="290" font-size="11" fill="#2563eb">缺知识</text>
  <rect x="90" y="300" width="220" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="200" y="324" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">RAG 检索增强</text>
  <text x="200" y="346" font-size="10" fill="#334155" text-anchor="middle">知识频繁更新、要溯源、要权限</text>
  <text x="200" y="362" font-size="10" fill="#334155" text-anchor="middle">改文档即改知识，无需训练</text>
  <text x="200" y="384" font-size="10" fill="#64748b" text-anchor="middle">企业知识库首选路线</text>

  <path d="M470 242 L 560 242 L 560 300" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#a12)"/>
  <text x="566" y="290" font-size="11" fill="#ea580c">缺实时数据 / 要执行动作</text>
  <rect x="450" y="300" width="230" height="104" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="565" y="324" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">Agent 工具调用</text>
  <text x="565" y="346" font-size="10" fill="#334155" text-anchor="middle">查订单、下单、发邮件、调 API</text>
  <text x="565" y="362" font-size="10" fill="#334155" text-anchor="middle">ReAct 循环 + Function Calling</text>
  <text x="565" y="384" font-size="10" fill="#64748b" text-anchor="middle">必须配护栏与人审</text>

  <rect x="330" y="300" width="110" height="104" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="385" y="322" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="middle">微调</text>
  <text x="385" y="342" font-size="10" fill="#334155" text-anchor="middle">要固定</text>
  <text x="385" y="358" font-size="10" fill="#334155" text-anchor="middle">风格/格式</text>
  <text x="385" y="374" font-size="10" fill="#334155" text-anchor="middle">领域语感</text>
  <text x="385" y="394" font-size="10" fill="#64748b" text-anchor="middle">成本最高</text>

  <rect x="40" y="420" width="680" height="38" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="380" y="444" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">判断顺序：先提示词 → 再 RAG → 再 Agent → 最后才微调（成本与迭代速度决定顺序）</text>

  <defs>
    <marker id="a12" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
