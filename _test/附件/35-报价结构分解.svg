<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="560" fill="#fbfcfe"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#1e293b">报价结构：从五个成本口袋到最终报价</text>
  <text x="24" y="52" font-size="11.5" fill="#64748b">以私有化知识库（200 人用）为例，成本 186.8 万 → 报价 287.4 万（毛利 35%）</text>

  <!-- 五个口袋 -->
  <text x="24" y="82" font-size="12" font-weight="700" fill="#334155">① 五个成本口袋（按金额堆叠，单位：万元）</text>

  <rect x="60" y="96" width="70" height="180" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="95" y="176" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">硬件</text>
  <text x="95" y="196" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">76</text>
  <text x="95" y="214" font-size="9.5" fill="#1e3a8a" text-anchor="middle">含五年</text>
  <text x="95" y="228" font-size="9.5" fill="#1e3a8a" text-anchor="middle">电费 21</text>

  <rect x="134" y="216" width="70" height="60" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="169" y="242" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">软件</text>
  <text x="169" y="260" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">12</text>

  <rect x="208" y="146" width="70" height="130" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="243" y="204" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">实施</text>
  <text x="243" y="222" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">19.2</text>
  <text x="243" y="240" font-size="9.5" fill="#064e3b" text-anchor="middle">6 人月</text>

  <rect x="282" y="228" width="70" height="48" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="317" y="248" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">数据工程</text>
  <text x="317" y="266" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">11.2</text>

  <rect x="356" y="188" width="70" height="88" fill="#fae8ff" stroke="#e9d5ff"/>
  <text x="391" y="226" font-size="10.5" font-weight="700" fill="#6b21a8" text-anchor="middle">运维</text>
  <text x="391" y="244" font-size="10.5" font-weight="700" fill="#6b21a8" text-anchor="middle">15.6</text>
  <text x="391" y="260" font-size="9.5" fill="#581c87" text-anchor="middle">首年</text>

  <rect x="430" y="248" width="70" height="28" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="465" y="267" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">隐性 11.8</text>

  <!-- 基线 -->
  <line x1="50" y1="276" x2="520" y2="276" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="530" y="280" font-size="10.5" fill="#64748b">成本小计 166.8</text>

  <!-- 箭头到总成本 -->
  <line x1="516" y1="200" x2="546" y2="200" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a35)"/>

  <!-- 加管理费与毛利 -->
  <text x="24" y="308" font-size="12" font-weight="700" fill="#334155">② 加上管理费与毛利，得到报价</text>

  <rect x="60" y="322" width="120" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="120" y="342" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">成本合计</text>
  <text x="120" y="360" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">186.8 万</text>

  <line x1="184" y1="345" x2="212" y2="345" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a35)"/>

  <rect x="216" y="322" width="120" height="46" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="276" y="342" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">管理费 + 风险 15%</text>
  <text x="276" y="360" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">+28.0 万</text>

  <line x1="340" y1="345" x2="368" y2="345" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a35)"/>

  <rect x="372" y="322" width="150" height="46" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="447" y="342" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">目标毛利 35%</text>
  <text x="447" y="360" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">成本 ÷ 0.65</text>

  <line x1="526" y1="345" x2="554" y2="345" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a35)"/>

  <rect x="558" y="318" width="98" height="54" rx="6" fill="#1e293b" stroke="#0f172a"/>
  <text x="607" y="340" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">报价</text>
  <text x="607" y="360" font-size="12.5" font-weight="700" fill="#f8fafc" text-anchor="middle">287.4 万</text>

  <!-- 三档锚定 -->
  <text x="24" y="400" font-size="12" font-weight="700" fill="#334155">③ 给三个选项做锚定（多数客户选中间）</text>
  <rect x="60" y="414" width="160" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="140" y="434" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">基础版 120 万</text>
  <text x="140" y="452" font-size="10" fill="#64748b" text-anchor="middle">单部门 / 2000 份</text>
  <text x="140" y="468" font-size="10" fill="#94a3b8" text-anchor="middle">锚点，显标准版划算</text>

  <rect x="240" y="410" width="180" height="70" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.6"/>
  <text x="330" y="432" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">标准版 287 万（目标）</text>
  <text x="330" y="450" font-size="10" fill="#334155" text-anchor="middle">三部门 / 8000 份 / 含运营</text>
  <text x="330" y="468" font-size="10" fill="#b45309" text-anchor="middle">预算被砍时可退到基础版</text>

  <rect x="440" y="414" width="160" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="520" y="434" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">增强版 480 万</text>
  <text x="520" y="452" font-size="10" fill="#64748b" text-anchor="middle">全域 + Agent 写操作</text>
  <text x="520" y="468" font-size="10" fill="#94a3b8" text-anchor="middle">抬高上限</text>

  <!-- 提醒 -->
  <rect x="60" y="498" width="540" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="76" y="523" font-size="11" fill="#92400e">三个最易漏算：五年电费 · 数据工程 · 质保期免费支持。漏一个，第一年就亏。</text>

  <text x="24" y="552" font-size="10.5" fill="#94a3b8">图 22-1　报价结构分解（章号对应正文第 22 章）</text>
</svg>
