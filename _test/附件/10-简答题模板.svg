<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">简答题万能答题模板：背景 → 方案 → 步骤 → 风险</text>

  <!-- Block 1 -->
  <rect x="30" y="48" width="700" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="30" y="48" width="8" height="76" rx="4" fill="#2563eb"/>
  <text x="56" y="76" font-size="14" font-weight="bold" fill="#1e40af">① 背景与需求（1–2 句）</text>
  <text x="56" y="100" font-size="12" fill="#334155">复述题目场景 + 点出核心痛点：知识分散更新慢？员工查资料难？数据不能外传？</text>
  <text x="56" y="118" font-size="11" fill="#64748b">作用：让阅卷人知道你读懂了题，而不是在背模板</text>

  <!-- Block 2 -->
  <rect x="30" y="132" width="700" height="86" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <rect x="30" y="132" width="8" height="86" rx="4" fill="#0d9488"/>
  <text x="56" y="160" font-size="14" font-weight="bold" fill="#0f766e">② 方案架构（3–4 句，点名技术组件）</text>
  <text x="56" y="184" font-size="12" fill="#334155">例如：采用 RAG 架构 = 文档分块 + Embedding 向量化 + 向量数据库 + 混合检索 + 重排 + 大模型生成</text>
  <text x="56" y="204" font-size="12" fill="#334155">如需多系统协同，补充 Agent + Function Calling；数据敏感则选私有化部署</text>

  <!-- Block 3 -->
  <rect x="30" y="226" width="700" height="86" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="30" y="226" width="8" height="86" rx="4" fill="#ea580c"/>
  <text x="56" y="254" font-size="14" font-weight="bold" fill="#9a3412">③ 实施步骤（分点写，4–6 步）</text>
  <text x="56" y="276" font-size="12" fill="#334155">第1步 需求调研与数据盘点 → 第2步 文档清洗分块 → 第3步 向量化入库 → 第4步 检索调优（混合检索+重排）</text>
  <text x="56" y="296" font-size="12" fill="#334155">→ 第5步 提示词与效果评估 → 第6步 灰度上线与培训交付</text>

  <!-- Block 4 -->
  <rect x="30" y="320" width="700" height="62" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="30" y="320" width="8" height="62" rx="4" fill="#7c3aed"/>
  <text x="56" y="346" font-size="14" font-weight="bold" fill="#5b21b6">④ 风险与优化（2–3 点）</text>
  <text x="56" y="368" font-size="12" fill="#334155">幻觉风险（加引用来源）/ 数据合规（脱敏、私有化）/ 效果不达标（Bad Case 分析、调分块与提示词）</text>
</svg>
