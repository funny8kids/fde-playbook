<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">典型 AI 项目交付甘特：12 周节奏</text>

  <!-- axis -->
  <text x="210" y="60" font-size="10" fill="#64748b" text-anchor="middle">W1</text>
  <text x="270" y="60" font-size="10" fill="#64748b" text-anchor="middle">W2</text>
  <text x="330" y="60" font-size="10" fill="#64748b" text-anchor="middle">W3</text>
  <text x="390" y="60" font-size="10" fill="#64748b" text-anchor="middle">W4</text>
  <text x="450" y="60" font-size="10" fill="#64748b" text-anchor="middle">W5</text>
  <text x="510" y="60" font-size="10" fill="#64748b" text-anchor="middle">W6</text>
  <text x="570" y="60" font-size="10" fill="#64748b" text-anchor="middle">W7</text>
  <text x="630" y="60" font-size="10" fill="#64748b" text-anchor="middle">W8</text>
  <text x="690" y="60" font-size="10" fill="#64748b" text-anchor="middle">W9</text>
  <text x="740" y="60" font-size="10" fill="#64748b" text-anchor="middle">W10+</text>

  <!-- grid -->
  <g stroke="#eef2f7">
    <line x1="210" y1="70" x2="210" y2="340"/>
    <line x1="270" y1="70" x2="270" y2="340"/>
    <line x1="330" y1="70" x2="330" y2="340"/>
    <line x1="390" y1="70" x2="390" y2="340"/>
    <line x1="450" y1="70" x2="450" y2="340"/>
    <line x1="510" y1="70" x2="510" y2="340"/>
    <line x1="570" y1="70" x2="570" y2="340"/>
    <line x1="630" y1="70" x2="630" y2="340"/>
    <line x1="690" y1="70" x2="690" y2="340"/>
  </g>

  <!-- tasks -->
  <text x="20" y="96" font-size="11" fill="#334155">需求调研</text>
  <rect x="180" y="82" width="120" height="20" rx="4" fill="#2563eb"/>
  <text x="20" y="130" font-size="11" fill="#334155">方案设计</text>
  <rect x="270" y="116" width="120" height="20" rx="4" fill="#2563eb"/>

  <text x="20" y="164" font-size="11" fill="#334155">POC 验证</text>
  <rect x="330" y="150" width="120" height="20" rx="4" fill="#0d9488"/>
  <text x="455" y="165" font-size="10" fill="#0f766e">★ 验收评审</text>

  <text x="20" y="198" font-size="11" fill="#334155">数据治理</text>
  <rect x="330" y="184" width="180" height="20" rx="4" fill="#7c3aed"/>
  <text x="20" y="232" font-size="11" fill="#334155">开发与调优</text>
  <rect x="390" y="218" width="180" height="20" rx="4" fill="#ea580c"/>

  <text x="20" y="266" font-size="11" fill="#334155">测试与评测</text>
  <rect x="510" y="252" width="120" height="20" rx="4" fill="#dc2626"/>

  <text x="20" y="300" font-size="11" fill="#334155">灰度上线</text>
  <rect x="570" y="286" width="90" height="20" rx="4" fill="#16a34a"/>
  <text x="20" y="334" font-size="11" fill="#334155">培训与运营</text>
  <rect x="630" y="320" width="110" height="20" rx="4" fill="#64748b"/>

  <rect x="20" y="356" width="720" height="34" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="380" y="378" font-size="11" fill="#92400e" text-anchor="middle">经验比例：数据治理往往吃掉 40% 以上工时；POC 不通过就回头改方案，不要硬推</text>
</svg>
