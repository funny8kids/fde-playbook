<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <!-- Left panel: token generation -->
  <rect x="20" y="20" width="430" height="400" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="15" font-weight="bold" fill="#1d4ed8">大模型如何生成文字：一次预测一个 Token</text>

  <rect x="40" y="64" width="120" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="89" font-size="13" fill="#334155" text-anchor="middle">输入文本</text>
  <path d="M160 84 L 192 84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="192" y="64" width="130" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="257" y="89" font-size="13" fill="#1e40af" text-anchor="middle">分词 Tokenize</text>
  <path d="M322 84 L 354 84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="122" width="444" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="150" font-size="13" fill="#334155">Token 序列：中国 / 的 / 首都 / 是</text>

  <path d="M262 168 L 262 190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="190" width="200" height="46" rx="8" fill="#1d4ed8"/>
  <text x="140" y="218" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">大模型计算</text>
  <path d="M240 213 L 272 213" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="272" y="190" width="212" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="378" y="218" font-size="13" fill="#334155" text-anchor="middle">输出下一个词的概率分布</text>

  <rect x="40" y="254" width="444" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="56" y="266" width="180" height="22" rx="4" fill="#dcfce7"/>
  <text x="146" y="281" font-size="12" fill="#15803d" text-anchor="middle">北京 92%</text>
  <rect x="56" y="294" width="70" height="22" rx="4" fill="#f1f5f9"/>
  <text x="91" y="309" font-size="12" fill="#475569" text-anchor="middle">上海 3%</text>
  <rect x="132" y="294" width="60" height="22" rx="4" fill="#f1f5f9"/>
  <text x="162" y="309" font-size="12" fill="#475569" text-anchor="middle">南京 2%</text>
  <text x="380" y="294" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">选中“北京”</text>

  <path d="M140 326 L 140 346" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="346" width="444" height="52" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="262" y="377" font-size="13" fill="#9a3412" text-anchor="middle">把新词拼回输入，循环生成，直到输出结束符</text>

  <!-- Right panel: embedding -->
  <rect x="470" y="20" width="270" height="400" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="605" y="48" font-size="15" font-weight="bold" fill="#0d9488" text-anchor="middle">Embedding：文本变向量</text>
  <rect x="490" y="62" width="230" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="605" y="87" font-size="13" fill="#334155" text-anchor="middle">语义相近 → 向量距离相近</text>

  <!-- vector space -->
  <rect x="490" y="116" width="230" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="605" y1="126" x2="605" y2="286" stroke="#e2e8f0"/>
  <line x1="500" y1="206" x2="710" y2="206" stroke="#e2e8f0"/>
  <circle cx="560" cy="170" r="10" fill="#0d9488"/>
  <text x="560" y="152" font-size="12" fill="#0f766e" text-anchor="middle">猫</text>
  <circle cx="600" cy="150" r="10" fill="#0d9488"/>
  <text x="622" y="140" font-size="12" fill="#0f766e" text-anchor="middle">猫咪</text>
  <circle cx="575" cy="205" r="10" fill="#0d9488"/>
  <text x="575" y="230" font-size="12" fill="#0f766e" text-anchor="middle">狗</text>
  <circle cx="655" cy="255" r="10" fill="#ea580c"/>
  <text x="672" y="262" font-size="12" fill="#c2410c" text-anchor="middle">汽车</text>
  <circle cx="530" cy="252" r="10" fill="#7c3aed"/>
  <text x="508" y="272" font-size="12" fill="#6d28d9" text-anchor="middle">苹果</text>

  <rect x="490" y="310" width="230" height="90" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="605" y="332" font-size="12" fill="#115e59" text-anchor="middle">"猫" → [0.23, -0.87, 0.41, ...]</text>
  <text x="605" y="354" font-size="12" fill="#115e59" text-anchor="middle">"猫咪" → [0.25, -0.82, 0.39, ...]</text>
  <text x="605" y="380" font-size="12" fill="#115e59" text-anchor="middle">两串数字非常接近 → 语义相似</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
