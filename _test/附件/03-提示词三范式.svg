<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="372" fill="#ffffff"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">三种高频提示词范式对比</text>

  <!-- Zero-shot -->
  <rect x="20" y="46" width="228" height="306" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="20" y="46" width="228" height="42" rx="10" fill="#2563eb"/>
  <text x="134" y="73" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Zero-shot 零样本</text>
  <text x="36" y="110" font-size="12" fill="#64748b">只给指令，不给示例</text>
  <rect x="36" y="122" width="196" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="146" font-size="12" fill="#334155">请把下面这句话翻译成英文：</text>
  <text x="48" y="168" font-size="12" fill="#334155">“今天天气很好。”</text>
  <path d="M134 242 L 134 256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="36" y="258" width="196" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="280" font-size="12" fill="#1e40af">The weather is very</text>
  <text x="48" y="300" font-size="12" fill="#1e40af">nice today.</text>

  <!-- Few-shot -->
  <rect x="266" y="46" width="228" height="306" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="266" y="46" width="228" height="42" rx="10" fill="#0d9488"/>
  <text x="380" y="73" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Few-shot 少样本</text>
  <text x="282" y="110" font-size="12" fill="#64748b">先给几个示例，再提问</text>
  <rect x="282" y="122" width="196" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="294" y="146" font-size="12" fill="#334155">苹果 → apple</text>
  <text x="294" y="168" font-size="12" fill="#334155">香蕉 → banana</text>
  <text x="294" y="190" font-size="12" fill="#334155">西瓜 → ？</text>
  <path d="M380 242 L 380 256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="282" y="258" width="196" height="52" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="294" y="288" font-size="12" fill="#115e59">watermelon（示例让模型</text>
  <text x="294" y="304" font-size="12" fill="#115e59">快速对齐输出格式）</text>

  <!-- CoT -->
  <rect x="512" y="46" width="228" height="306" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="512" y="46" width="228" height="42" rx="10" fill="#7c3aed"/>
  <text x="626" y="73" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">CoT 思维链</text>
  <text x="528" y="110" font-size="12" fill="#64748b">让模型“分步思考”再作答</text>
  <rect x="528" y="122" width="196" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="540" y="146" font-size="12" fill="#334155">一个商店苹果 5 元/斤，</text>
  <text x="540" y="168" font-size="12" fill="#334155">买 3 斤花了多少钱？</text>
  <text x="540" y="196" font-size="12" fill="#7c3aed">请一步一步推理，再给出答案。</text>
  <path d="M626 242 L 626 256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="528" y="258" width="196" height="52" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="540" y="280" font-size="12" fill="#5b21b6">第1步：单价 5 元</text>
  <text x="540" y="300" font-size="12" fill="#5b21b6">第2步：5 × 3 = 15 元</text>

  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
