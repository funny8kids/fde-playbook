<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">分块策略 与 混合检索：RAG 效果的两个关键旋钮</text>

  <!-- Left: chunking -->
  <rect x="20" y="44" width="360" height="366" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="200" y="72" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">文档分块策略</text>

  <rect x="44" y="88" width="312" height="26" rx="4" fill="#e2e8f0"/>
  <text x="56" y="106" font-size="11" fill="#475569">原始文档（一整篇）</text>

  <rect x="44" y="126" width="90" height="44" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="89" y="146" font-size="11" fill="#1e40af" text-anchor="middle">块1</text>
  <text x="89" y="162" font-size="10" fill="#64748b" text-anchor="middle">含上下文</text>
  <rect x="140" y="126" width="90" height="44" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="185" y="146" font-size="11" fill="#1e40af" text-anchor="middle">块2</text>
  <text x="185" y="162" font-size="10" fill="#64748b" text-anchor="middle">与块1有重叠</text>
  <rect x="236" y="126" width="90" height="44" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="281" y="146" font-size="11" fill="#1e40af" text-anchor="middle">块3</text>
  <text x="281" y="162" font-size="10" fill="#64748b" text-anchor="middle">与块2有重叠</text>

  <rect x="44" y="188" width="312" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="208" font-size="12" font-weight="bold" fill="#334155">块太大</text>
  <text x="56" y="228" font-size="11" fill="#64748b">噪声多、超出模型上下文、成本高</text>
  <rect x="44" y="248" width="312" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="268" font-size="12" font-weight="bold" fill="#334155">块太小</text>
  <text x="56" y="288" font-size="11" fill="#64748b">语义不完整、答案被切断</text>
  <rect x="44" y="308" width="312" height="86" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="56" y="330" font-size="12" font-weight="bold" fill="#92400e">常用做法</text>
  <text x="56" y="350" font-size="11" fill="#78350f">· 按 300–500 字（或 Token）切分</text>
  <text x="56" y="368" font-size="11" fill="#78350f">· 相邻块保留 10–20% 重叠</text>
  <text x="56" y="386" font-size="11" fill="#78350f">· 优先按标题 / 段落等结构切分</text>

  <!-- Right: hybrid search -->
  <rect x="400" y="44" width="340" height="366" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="570" y="72" font-size="14" font-weight="bold" fill="#0d9488" text-anchor="middle">混合检索 + 重排</text>

  <rect x="424" y="88" width="140" height="52" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="494" y="110" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">向量检索</text>
  <text x="494" y="130" font-size="10" fill="#115e59" text-anchor="middle">懂语义：搜“如何退款”</text>
  <rect x="576" y="88" width="140" height="52" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="646" y="110" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">关键词检索</text>
  <text x="646" y="130" font-size="10" fill="#9a3412" text-anchor="middle">BM25：精确匹配词</text>

  <path d="M494 140 L 494 166 L 540 166 L 540 190" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr5)"/>
  <path d="M646 140 L 646 166 L 600 166 L 600 190" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr5)"/>
  <rect x="424" y="190" width="292" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="570" y="218" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">结果融合（如 RRF 算法）</text>

  <path d="M570 236 L 570 258" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr5)"/>
  <rect x="424" y="258" width="292" height="46" rx="8" fill="#7c3aed"/>
  <text x="570" y="286" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">重排模型 Re-rank 精排</text>

  <path d="M570 304 L 570 326" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr5)"/>
  <rect x="424" y="326" width="292" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="570" y="350" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">取最相关的 Top-K 文档</text>
  <text x="570" y="372" font-size="11" fill="#64748b" text-anchor="middle">交给大模型作为答题依据</text>

  <defs>
    <marker id="arr5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
