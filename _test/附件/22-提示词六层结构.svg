<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">一条生产级提示词的六层结构</text>

  <rect x="30" y="48" width="330" height="58" rx="8" fill="#1d4ed8"/>
  <text x="46" y="70" font-size="12" font-weight="bold" fill="#ffffff">① 角色与边界</text>
  <text x="46" y="90" font-size="10" fill="#dbeafe">你是谁、服务谁、只做什么、不做什么</text>
  <rect x="400" y="48" width="330" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="416" y="70" font-size="11" fill="#334155">「你是某企业设备维修助手，只回答</text>
  <text x="416" y="90" font-size="11" fill="#334155">维修相关问题，不提供医疗或法律建议」</text>

  <rect x="30" y="116" width="330" height="58" rx="8" fill="#0d9488"/>
  <text x="46" y="138" font-size="12" font-weight="bold" fill="#ffffff">② 任务定义</text>
  <text x="46" y="158" font-size="10" fill="#ccfbf1">输入是什么、输出是什么、成功的标准</text>
  <rect x="400" y="116" width="330" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="416" y="138" font-size="11" fill="#334155">「根据【资料】回答【问题】，给出结论</text>
  <text x="416" y="158" font-size="11" fill="#334155">与依据，不确定时说明无法确定」</text>

  <rect x="30" y="184" width="330" height="58" rx="8" fill="#7c3aed"/>
  <text x="46" y="206" font-size="12" font-weight="bold" fill="#ffffff">③ 输入区（变量占位）</text>
  <text x="46" y="226" font-size="10" fill="#ede9fe">{question}、{context}、{user_role}、{today}</text>
  <rect x="400" y="184" width="330" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="416" y="206" font-size="11" fill="#334155">用分隔符把「指令」与「数据」隔开，</text>
  <text x="416" y="226" font-size="11" fill="#334155">防注入：资料里的话不是指令</text>

  <rect x="30" y="252" width="330" height="58" rx="8" fill="#ea580c"/>
  <text x="46" y="274" font-size="12" font-weight="bold" fill="#ffffff">④ 约束（负面清单）</text>
  <text x="46" y="294" font-size="10" fill="#ffedd5">禁止编造、必须引用、数字原文照抄</text>
  <rect x="400" y="252" width="330" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="416" y="274" font-size="11" fill="#334155">「资料中没有的信息一律回答未找到，</text>
  <text x="416" y="294" font-size="11" fill="#334155">不得推测；金额与日期必须原文照抄」</text>

  <rect x="30" y="320" width="330" height="58" rx="8" fill="#dc2626"/>
  <text x="46" y="342" font-size="12" font-weight="bold" fill="#ffffff">⑤ 输出格式（结构化）</text>
  <text x="46" y="362" font-size="10" fill="#fee2e2">字段、顺序、长度、引用编号规则</text>
  <rect x="400" y="320" width="330" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="416" y="342" font-size="11" fill="#334155">「结论 / 步骤 / 依据[编号] / 风险提示，</text>
  <text x="416" y="362" font-size="11" fill="#334155">总字数不超过 300 字」</text>

  <rect x="30" y="388" width="330" height="58" rx="8" fill="#64748b"/>
  <text x="46" y="410" font-size="12" font-weight="bold" fill="#ffffff">⑥ 示例（Few-shot，可选）</text>
  <text x="46" y="430" font-size="10" fill="#e2e8f0">1–3 个高质量示例，示范格式与语气</text>
  <rect x="400" y="388" width="330" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="416" y="410" font-size="11" fill="#334155">示例要短、要典型；示例错了比没示例</text>
  <text x="416" y="430" font-size="11" fill="#334155">更糟——模型会忠实模仿错误</text>
</svg>
